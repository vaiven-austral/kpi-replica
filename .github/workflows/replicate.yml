name: Replicate data branch

# Rule 10b of the lab4-kpis proposal: a mirror in another organization, not a fork.
# Runs one hour after the daily export of lab4-kpis/kpis (06:17 Buenos Aires).

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replicate
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: ./replicate.sh
